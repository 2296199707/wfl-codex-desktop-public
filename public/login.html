<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>WFL Codex Web Workspace 登录</title>
    <link rel="stylesheet" href="/login.css?v=0.44.55" />
  </head>
  <body>
    <button class="language-toggle" type="button" data-language-toggle title="Switch to English" aria-label="Switch to English">
      <span data-language-label>EN</span>
    </button>
    <main class="login-shell">
      <header class="login-brand">
        <span class="brand-mark">W</span>
        <div>
          <strong>WFL Codex</strong>
          <span>安全工作区</span>
        </div>
      </header>
      <section class="login-panel" aria-labelledby="loginTitle">
        <div class="panel-heading">
          <span class="eyebrow" id="modeLabel">账户访问</span>
          <h1 id="loginTitle">登录工作区</h1>
          <p id="loginSummary">使用你的工作区账号继续。</p>
        </div>
        <div class="mode-tabs" role="tablist" aria-label="账户操作">
          <button class="mode-tab active" id="loginTab" type="button" role="tab" aria-selected="true">登录</button>
          <button class="mode-tab" id="registerTab" type="button" role="tab" aria-selected="false" hidden>使用邀请注册</button>
        </div>
        <form id="loginForm" novalidate>
          <label>
            <span>用户名</span>
            <input id="usernameInput" name="username" required minlength="3" maxlength="32" autocomplete="username" />
          </label>
          <label>
            <span>密码</span>
            <input id="passwordInput" name="password" type="password" required minlength="16" maxlength="256" autocomplete="current-password" />
          </label>
          <p class="form-hint" id="passwordHint" hidden>密码至少 16 个字符。</p>
          <p class="form-error" id="formError" role="alert"></p>
          <button class="submit-button" id="submitButton" type="submit">登录</button>
        </form>
        <p class="login-footer"><a href="/rescue/">打开备用窗口</a></p>
      </section>
    </main>
    <script src="/i18n.js?v=0.44.55"></script>
    <script src="/login.js?v=0.44.55"></script>
  </body>
</html>
