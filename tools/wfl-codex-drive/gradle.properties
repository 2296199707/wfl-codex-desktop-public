#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Wed Aug 10 09:30:47 CEST 2022
# Android APK builds run on the main server, so keep the Gradle JVM and
# worker count bounded even when this project is invoked outside the plugin.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -XX:+UseSerialGC
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx512m
android.enableJetifier=false
android.useAndroidX=true
de.felixnuesse.extract.goVersion=1.24
de.felixnuesse.extract.rCloneVersion=1.71.0
de.felixnuesse.extract.ndkVersion=28.2.13676358
de.felixnuesse.extract.ndkToolchainVersion=33
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
